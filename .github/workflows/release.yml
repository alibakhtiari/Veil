name: release

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. 1.0.0 or v1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Desktop GUI installers (Tauri v2: Windows, macOS, Linux).
  # ------------------------------------------------------------------
  gui-desktop:
    name: GUI (${{ matrix.platform }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            platform: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            platform: macos
            arch: universal
            target: universal-apple-darwin
          - os: macos-latest
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aether-gui/frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        working-directory: aether-gui/frontend
        run: npm ci

      - name: Build desktop application (Tauri CLI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_SIGNING_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: aether-gui
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: "Veil ${{ inputs.tag_name || github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Gather and hash installers
        shell: bash
        run: |
          mkdir -p dist-gui
          find aether-gui/target -path "*/bundle/*" -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} dist-gui/ \; 2>/dev/null || true
          cd dist-gui
          for f in *; do
            if [ -f "$f" ]; then
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$f" > "$f.sha256"
              else
                shasum -a 256 "$f" > "$f.sha256"
              fi
            fi
          done

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist-gui/
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Android native APK & AAB.
  # ------------------------------------------------------------------
  gui-android:
    name: Android app (APK & AAB)
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK r26d
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install Rust toolchain and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build clang \
            golang-go nasm perl pkg-config

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Compile libaether.so for Android ABIs
        working-directory: aether
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          mkdir -p ../android/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p ../android/app/src/main/jniLibs/x86_64
          cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs/ build --release
          cargo ndk -t armeabi-v7a -o ../android/app/src/main/jniLibs/ build --release
          cargo ndk -t x86_64 -o ../android/app/src/main/jniLibs/ build --release

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Android APKs and app bundle
        working-directory: android
        run: gradle assembleRelease bundleRelease

      - name: Sign Android release artifacts
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKey: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_SIGNING_KEY }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Compute checksums
        working-directory: android/app/build/outputs
        run: |
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -exec sha256sum {} \; > CHECKSUMS-ANDROID.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-android-builds
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/CHECKSUMS-ANDROID.txt

  # ------------------------------------------------------------------
  # Collect every GUI artifact, generate SHA-256 checksums and publish.
  # ------------------------------------------------------------------
  release:
    name: Publish release
    needs: [gui-desktop, gui-android]
    runs-on: ubuntu-latest
    if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          shopt -s nullglob
          files=(*.msi *.exe *.dmg *.deb *.rpm *.AppImage *.apk *.aab *.tar.gz *.zip)
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "$f.sha256"
            fi
          done
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS.txt
            echo "----- SHA256SUMS.txt -----"
            cat SHA256SUMS.txt
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: "Veil ${{ inputs.tag_name || github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/**/*
          body: |
            Veil ${{ inputs.tag_name || github.ref_name }}

            Veil is a stealth censorship circumvention client with dedicated Desktop GUI (Windows, macOS, Linux) and Mobile (Native Android VPN) applications.

            Every installer ships with a matching .sha256 file, and SHA256SUMS.txt lists them all.

            See README.md and TODO.md for setup instructions and roadmap.

