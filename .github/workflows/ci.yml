# Continuous verification: unit tests + frontend checks.
#
# Headless test verification: pure builders, ring buffers, loopback
# sockets, pre-cancelled tokens. The Tauri window only exists in
# main(), which unit tests never execute.
#
# Tag releases are handled by release.yml; this workflow guards main.

name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - 'Docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - 'Docs/**'

jobs:
  test-core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: aether -> target

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build clang \
            golang-go nasm perl pkg-config

      - name: Core library tests
        working-directory: aether
        run: cargo test --lib

  test-gui:
    name: Desktop GUI tests & clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: aether-gui/src-tauri -> target

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build clang \
            golang-go nasm perl pkg-config \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: Desktop GUI backend tests (default + tun feature)
        working-directory: aether-gui/src-tauri
        run: |
          cargo test
          cargo test --features tun

      - name: Clippy (GUI backend, warnings deny the job)
        working-directory: aether-gui/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  test-frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aether-gui/frontend/package-lock.json

      - name: Frontend typecheck and build
        working-directory: aether-gui/frontend
        run: |
          npm ci
          npm run check
          npm run build

  bump-and-tag:
    name: Auto Bump Version & Trigger Release
    needs: [test-core, test-gui, test-frontend]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main

      - name: Calculate Next Version
        id: semver
        run: |
          git fetch --tags --force
          chmod +x scripts/bump-version.sh
          NEXT_VER="$(./scripts/bump-version.sh --next)"
          NEXT_TAG="v${NEXT_VER}"
          echo "Calculated next version: $NEXT_VER (tag: $NEXT_TAG)"
          echo "version=$NEXT_VER" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

      - name: Bump Project Manifests
        run: |
          ./scripts/bump-version.sh "${{ steps.semver.outputs.version }}"

      - name: Commit, Push and Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="${{ steps.semver.outputs.tag }}"
          NEW_VER="${{ steps.semver.outputs.version }}"

          git add \
            aether-gui/frontend/package.json \
            aether-gui/frontend/package-lock.json \
            aether-gui/src-tauri/Cargo.toml \
            aether/Cargo.toml \
            android/app/build.gradle 2>/dev/null || true

          git add aether/Cargo.lock aether-gui/src-tauri/Cargo.lock 2>/dev/null || true

          # Commit version bump with [skip ci] to prevent recursive runs
          git commit -m "chore(release): bump version to ${NEW_TAG} [skip ci]"
          git pull --rebase origin main
          git push origin main

          # Create and push release tag
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
          git push origin "${NEW_TAG}"

          # Explicitly trigger release build workflow with the new tag
          gh workflow run release.yml -f tag_name="${NEW_TAG}"

